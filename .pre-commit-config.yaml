# Configuração de pre-commit do HybridCrewAI.
# Requer o ambiente virtual activo (.venv\Scripts no Windows).
minimum_pre_commit_version: "4.0.0"
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff - análise estática
        entry: python -m ruff check
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format-check
        name: Ruff - verificação de formatação
        entry: python -m ruff format --check
        language: system
        types: [python]
        require_serial: true
      - id: check-file-size
        name: Guarda - limite de linhas
        entry: python scripts/check_file_size.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: validate-plan
        name: Guarda - validação do plano
        entry: python scripts/validate_plan.py
        language: system
        files: ^tasks\.yaml$
        pass_filenames: false
        require_serial: true
      - id: check-modules
        name: Guarda - módulos documentados
        entry: python scripts/check_modules.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: lint-skills
        name: Guarda - Skills
        entry: python scripts/lint_skills.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: check-traceability
        name: Guarda - rastreabilidade
        entry: python scripts/check_traceability.py
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
