public_api: [main, follow, formatar_evento, run, verificar_config, verificar_sqlite, verificar_redaccao]
depends_on: [biblioteca padrão argparse, json, os, pathlib, sqlite3, sys, time, uuid, app.core.config, app.core.events, app.core.logging, app.core.tasks, app.llm.consent, app.llm.contracts, app.llm.egress, app.llm.providers]
events_emitted: []
events_consumed: [eventos JSONL de logs/events.jsonl]
tests: [tests/integration/test_cli.py, tests/integration/test_llm_ping.py]
