name: workspace
purpose: Manter caminhos confinados à raiz resolvida, classificar e reter anexos sensíveis, ingerir ZIPs com validação completa antes de gravar, criar snapshots com rollback e undo verificáveis, registar auditoria e aplicar escritas atómicas com recuperação.
public_api:
  - WorkspacePathError
  - validate_workspace_path
  - IgnoreReason
  - IgnoredFile
  - WorkspaceScan
  - scan_workspace
  - SensitiveReason
  - SensitiveFile
  - classify_sensitive
  - QuarantineError
  - QuarantineLimits
  - QuarantinedAttachment
  - quarantine_attachment
  - release_quarantine
  - ArchiveError
  - ArchiveLimits
  - ArchiveEntry
  - ArchiveReport
  - ingest_zip
  - SnapshotError
  - SnapshotLimits
  - SnapshotEntry
  - Snapshot
  - create_snapshot
  - inventory_workspace
  - snapshot_digest
  - RollbackError
  - RollbackReport
  - UndoReport
  - load_snapshot
  - rollback
  - undo_rollback
  - AuditError
  - AuditLimits
  - AuditTrail
  - FileChange
  - FileOpLimits
  - FileOpReport
  - FileOpsError
  - RecoveryReport
  - apply_atomic
  - recover_workspace
depends_on: [llm-egress]
events_emitted:
  - workspace.pending
  - workspace.write
  - workspace.interrupted
  - workspace.failed
  - workspace.recovery
events_consumed: []
tests:
  - tests/unit/test_workspace_paths.py
  - tests/security/test_phase05_paths.py
  - tests/unit/test_workspace_scanner.py
  - tests/security/test_phase05_quarantine.py
  - tests/security/test_phase05_zip.py
  - tests/integration/test_workspace_snapshot.py
  - tests/recovery/test_workspace_interrupt.py
  - tests/recovery/test_workspace_audit_attack.py
limits:
  - caminhos relativos, absolutos rejeitados
  - travessia, nomes reservados e caminhos longos rejeitados
  - symlinks e junctions rejeitados antes de abertura
  - lidos e ignorados somam o total de ficheiros listados
  - motivos de ignorado estáveis: link, invalid-path, too-large, not-regular, unreadable
  - nenhum conteúdo de ficheiro é lido pelo scanner nem nenhuma ligação é seguida
  - ficheiros sensíveis classificados por nome e conteúdo sem expor texto
  - anexos copiados para quarentena com SHA-256 e libertados só com token opaco
  - entradas ZIP validadas em memória antes de qualquer escrita
  - Zip Slip, caminhos absolutos, ligações e entradas especiais rejeitados
  - limites de bytes por ficheiro, total, ZIP, entradas, rácio e aninhamento
  - extração atómica em staging dentro do workspace sem expor conteúdo
  - snapshots com inventário SHA-256, limites e manifesto verificado
  - rollback com undo automático e verificação final do digest
  - ligações, travessia e manifestos forjados rejeitados antes de aplicar
  - staging limpo quando a gravação ou aplicação falha antes do commit
  - auditoria JSONL com allowlist de metadados e sem conteúdo de ficheiros
  - journal com manifesto verificado por SHA-256 e quebra de integridade recusada
  - escrita atómica por operação com staging, confirmação e recuperação
  - pendências e staging órfão descartados na recuperação
  - nenhuma alteração pode escrever dentro de .file-ops
